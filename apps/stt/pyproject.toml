[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jewelai-stt"
version = "1.0.0"
description = "Private, offline speech transcription; no Product State authority"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.121.1",
  "httpx==0.28.1",
  "google-auth==2.40.3",
  "requests==2.32.5",
  "imageio-ffmpeg==0.6.0",
  "uvicorn==0.38.0",
]

[project.optional-dependencies]
model = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.5",
  "huggingface-hub==0.36.2",
  "numpy==2.2.6",
]
test = ["pytest==8.4.2", "ruff==0.16.9"]
build = ["hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/jewelai_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
