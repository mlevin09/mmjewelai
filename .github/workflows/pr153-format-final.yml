name: One-time PR153 formatter
on:
  push:
    branches:
      - chatgpt/studio-v3-contextual-clarifications-20261106
    paths:
      - .github/workflows/pr153-format-final.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/studio-v3-contextual-clarifications-20261106
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format modified UI files
        working-directory: apps/web
        run: |
          npm ci
          npx prettier --write src/EnrichmentWorkspace.tsx src/EnrichmentWorkspace.test.tsx src/styles.css
      - name: Commit changed files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/EnrichmentWorkspace.tsx apps/web/src/EnrichmentWorkspace.test.tsx apps/web/src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style(web): format final clarification and completion UX"
            git push origin HEAD:chatgpt/studio-v3-contextual-clarifications-20261106
          fi
