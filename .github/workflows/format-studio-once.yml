name: Format studio working branch once
on:
  push:
    branches:
      - codex/web-conversation-ux-v2
    paths:
      - .github/workflows/format-studio-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Format changed Web files
        working-directory: apps/web
        run: |
          npm ci
          npx prettier --write src/EnrichmentWorkspace.tsx src/EnrichmentWorkspace.test.tsx src/styles.css
      - name: Commit formatting to this feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/EnrichmentWorkspace.tsx apps/web/src/EnrichmentWorkspace.test.tsx apps/web/src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style(web): format studio UI changes"
            git push origin HEAD:codex/web-conversation-ux-v2
          fi
