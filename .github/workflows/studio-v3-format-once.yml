name: Temporary Studio V3 formatter
on:
  push:
    branches:
      - chatgpt/studio-v3-piece-flow-20261106
    paths:
      - .github/workflows/studio-v3-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/studio-v3-piece-flow-20261106
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format changed frontend files
        working-directory: apps/web
        run: |
          npm ci
          npx prettier --write src/EnrichmentWorkspace.tsx src/EnrichmentWorkspace.test.tsx src/styles.css
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/EnrichmentWorkspace.tsx apps/web/src/EnrichmentWorkspace.test.tsx apps/web/src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style(web): format product-first studio"
            git push origin HEAD:chatgpt/studio-v3-piece-flow-20261106
          fi
