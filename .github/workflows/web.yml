name: Web

on:
  pull_request:
    branches: [jewelai-v2]
    paths:
      - apps/web/**
      - apps/api/**
      - packages/domain/**
      - data/roles/**
      - data/dictionary/**
      - data/questions/**
      - infra/terraform/production/**
      - .github/workflows/deploy-production.yml
      - .github/workflows/web.yml
  push:
    branches: [jewelai-v2]
    paths:
      - apps/web/**
      - apps/api/**
      - packages/domain/**
      - data/roles/**
      - data/dictionary/**
      - data/questions/**
      - infra/terraform/production/**
      - .github/workflows/deploy-production.yml
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
