name: Domain contracts

on:
  pull_request:
    branches: [jewelai-v2]
    paths:
      - packages/domain/**
      - specs/jewelry-design-schema/**
      - specs/roles/**
      - data/roles/**
      - specs/dictionary/**
      - data/dictionary/**
      - specs/questions/**
      - data/questions/**
      - .github/workflows/domain-schema.yml
  push:
    branches: [jewelai-v2]
    paths:
      - packages/domain/**
      - specs/jewelry-design-schema/**
      - specs/roles/**
      - data/roles/**
      - specs/dictionary/**
      - data/dictionary/**
      - specs/questions/**
      - data/questions/**
      - .github/workflows/domain-schema.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './packages/domain[test]'
      - run: python -m pytest -c packages/domain/pyproject.toml packages/domain/tests -q
      - run: python -m ruff check packages/domain
      - run: python -m ruff format --check packages/domain
