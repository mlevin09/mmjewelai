name: Runtime API

on:
  pull_request:
    branches: [jewelai-v2]
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: Exact authorized source HEAD for a lightweight gate recheck
        required: true
        type: string
      base_sha:
        description: Original PR target SHA (merge-base is computed, not last-commit diff)
        required: true
        type: string
      full_run_id:
        description: Successful explicitly authorized Full Regression run on this exact SHA
        required: true
        type: string
      reason:
        description: Reason for this Owner-authorized lightweight recheck
        required: true
        type: string
      authorization_reference:
        description: Reference to explicit Owner authorization
        required: true
        type: string

permissions:
  contents: read
  actions: read # Read a supplied full-run receipt; never dispatch or write statuses.

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # High-risk targeted checks are not cut to the ordinary 5–15m goal.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jewelai_test
          POSTGRES_USER: jewelai
          POSTGRES_PASSWORD: jewelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jewelai -d jewelai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://jewelai:jewelai@localhost:5432/jewelai_test
      TEST_POSTGRES_URL: postgresql+psycopg://jewelai:jewelai@localhost:5432/jewelai_test
    steps:
      - name: Validate an explicitly authorized manual lightweight recheck
        if: github.event_name == 'workflow_dispatch'
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          SOURCE_SHA: ${{ github.sha }}
          AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          [[ "${CONFIRM_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${CONFIRM_SHA}" = "${SOURCE_SHA}"
          test -n "${AUTHORIZATION_REFERENCE}"
          test -n "${REASON}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.confirm_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Select PR tests against the complete PR merge base
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.confirm_sha }}
        run: >-
          python tools/ci/pr_selection.py --base "${BASE_SHA}" --head "${HEAD_SHA}"
          --output "${{ runner.temp }}/pr-selection.json"
      - name: Install the unchanged dependency/extras set once
        if: steps.selection.outputs.needs_tests == 'true'
        run: bash tools/ci/install_runtime.sh
      - name: Existing backend lint and format checks
        if: steps.selection.outputs.needs_tests == 'true'
        run: |
          python -m ruff check apps/api packages workers/generation tests tools/ci
          python -m ruff format --check apps/api packages workers/generation tests tools/ci
      - name: Verify disposable PostgreSQL before any migration or test DDL
        if: steps.selection.outputs.needs_tests == 'true'
        run: >-
          python -c "import sys; sys.path.insert(0, 'apps/api/tests');
          from disposable_postgres import verified_ci_postgres; verified_ci_postgres()"
      - name: Existing migration safety checks on the verified disposable service
        if: steps.selection.outputs.needs_tests == 'true'
        run: |
          alembic -c packages/persistence/alembic.ini upgrade head
          alembic -c packages/persistence/alembic.ini check
          alembic -c packages/persistence/alembic.ini current
      - name: Validate the supplied full-run identity (read-only; no dispatch)
        id: qualified
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.full_run_id }}
          SOURCE_SHA: ${{ inputs.confirm_sha }}
        run: >-
          python tools/ci/qualification.py metadata --run-id "${RUN_ID}"
          --sha "${SOURCE_SHA}" --output "${{ runner.temp }}/full-run-metadata.json"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ${{ steps.qualified.outputs.artifact_name }}
          run-id: ${{ inputs.full_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified-full
      - name: Run all selected checks or verify already-complete exact-SHA full coverage
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          QUALIFICATION=()
          if test "${EVENT_NAME}" = workflow_dispatch; then
            QUALIFICATION=(--qualification "${RUNNER_TEMP}/qualified-full/qualification.json" --metadata "${RUNNER_TEMP}/full-run-metadata.json")
          fi
          python tools/ci/pr_checks.py --manifest "${RUNNER_TEMP}/pr-selection.json" \
            --output "${RUNNER_TEMP}/pr-results" "${QUALIFICATION[@]}"
      - name: Retain bounded selected coverage and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-risk-results-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr-selection.json
            ${{ runner.temp }}/pr-results/
          retention-days: 3
          if-no-files-found: error
