name: Runtime API

on:
  pull_request:
    branches: [jewelai-v2]
    paths:
      - apps/api/**
      - packages/persistence/**
      - packages/domain/**
      - data/roles/**
      - data/dictionary/**
      - data/questions/**
      - data/rules/**
      - .github/workflows/runtime-api.yml
  push:
    branches: [jewelai-v2]
    paths:
      - apps/api/**
      - packages/persistence/**
      - packages/domain/**
      - data/roles/**
      - data/dictionary/**
      - data/questions/**
      - data/rules/**
      - .github/workflows/runtime-api.yml

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jewelai_test
          POSTGRES_USER: jewelai
          POSTGRES_PASSWORD: jewelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jewelai -d jewelai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://jewelai:jewelai@localhost:5432/jewelai_test
      TEST_POSTGRES_URL: postgresql+psycopg://jewelai:jewelai@localhost:5432/jewelai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './packages/domain[test]'
      - run: python -m pip install -e './packages/persistence'
      - run: python -m pip install -e './apps/api[test]'
      - run: alembic -c packages/persistence/alembic.ini upgrade head
      - run: alembic -c packages/persistence/alembic.ini check
      - run: alembic -c packages/persistence/alembic.ini current
      - run: python -m pytest -c packages/domain/pyproject.toml packages/domain/tests -q
      - run: python -m pytest -c apps/api/pyproject.toml apps/api/tests -q
      - run: python -m ruff check apps/api packages/persistence
      - run: python -m ruff format --check apps/api packages/persistence
