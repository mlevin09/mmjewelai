name: Full Regression

on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: Exact authorized source HEAD (40 hex characters)
        required: true
        type: string
      reason:
        description: Reason for the Owner-authorized full regression
        required: true
        type: string
      authorization_reference:
        description: Reference to explicit Owner authorization
        required: true
        type: string
      resource_budget:
        description: Maximum configured runner exposure, not predicted duration
        required: true
        type: choice
        options: ['465 runner-minutes']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - name: Validate explicit full-regression authorization and exact SHA
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          REASON: ${{ inputs.reason }}
          RESOURCE_BUDGET: ${{ inputs.resource_budget }}
        run: |
          set -euo pipefail
          [[ "${CONFIRM_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${CONFIRM_SHA}" = "${SOURCE_SHA}"
          [[ "${SOURCE_REF}" = refs/heads/* ]]
          test -n "${AUTHORIZATION_REFERENCE}"
          test -n "${REASON}"
          test "${RESOURCE_BUDGET}" = '465 runner-minutes'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.confirm_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - run: bash tools/ci/install_runtime.sh
      - run: python -m ruff check apps/api packages/auth packages/auth_oidc packages/auth_identity_platform packages/generation_queue packages/generation_queue_gcp packages/parser packages/text_understanding_google packages/prompts packages/model_gateway packages/model_gateway_google packages/model_gateway_openai packages/assets packages/assets_gcs packages/persistence workers/generation tests tools/ci
      - run: python -m ruff format --check apps/api packages/auth packages/auth_oidc packages/auth_identity_platform packages/generation_queue packages/generation_queue_gcp packages/parser packages/text_understanding_google packages/prompts packages/model_gateway packages/model_gateway_google packages/model_gateway_openai packages/assets packages/assets_gcs packages/persistence workers/generation tests tools/ci
      - name: Execute every existing full unit suite with outcome accounting
        run: >-
          python tools/ci/full_units.py --output "${{ runner.temp }}/full-unit-reports"
          --proof "${{ runner.temp }}/api-plan/unit-coverage.json"
      - name: Collect complete API inventory (no fixture setup or test calls)
        run: >-
          python tools/ci/api_timings.py --output "${{ runner.temp }}/api-collection"
          --timeout-seconds 120
          -- -c apps/api/pyproject.toml apps/api/tests --collect-only
      - name: Plan all required partitions
        id: plan
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/api-plan"
          python tools/ci/api_partitions.py plan \
            --collection "${RUNNER_TEMP}/api-collection/collection.json" \
            --output "${RUNNER_TEMP}/api-plan/plan.json" | tee "${RUNNER_TEMP}/plan-output"
          grep '^plan_sha256=' "${RUNNER_TEMP}/plan-output" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: api-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-plan/
          retention-days: 3
          if-no-files-found: error

  api_isolated:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        partition: [isolated-0, isolated-1, isolated-2, isolated-3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.confirm_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - run: bash tools/ci/install_runtime.sh
      - uses: actions/download-artifact@v4
        with:
          name: api-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-plan
      - name: Run one reviewed isolated partition
        run: >-
          python tools/ci/api_timings.py --output "${{ runner.temp }}/api-report"
          --plan "${{ runner.temp }}/api-plan/plan.json"
          --partition "${{ matrix.partition }}"
          --plan-sha256 "${{ needs.prepare.outputs.plan_sha256 }}"
          --timeout-seconds 4800
          -- -c apps/api/pyproject.toml apps/api/tests
      - name: Upload safe partition evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report-${{ github.run_attempt }}-${{ matrix.partition }}
          path: ${{ runner.temp }}/api-report/
          retention-days: 3
          if-no-files-found: error

  # Keep this exact check/job identity, including for the disposable-PG safety gate.
  # Its service is created AFTER isolated jobs end, not while waiting for them.
  runtime:
    needs: [prepare, api_isolated]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jewelai_test
          POSTGRES_USER: jewelai
          POSTGRES_PASSWORD: jewelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jewelai -d jewelai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://jewelai:jewelai@localhost:5432/jewelai_test
      TEST_POSTGRES_URL: postgresql+psycopg://jewelai:jewelai@localhost:5432/jewelai_test
    steps:
      - name: Require valid inventory; preserve failed isolated results for final gate
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          ISOLATED_RESULT: ${{ needs.api_isolated.result }}
        run: |
          test "${PREPARE_RESULT}" = success
          test "${ISOLATED_RESULT}" = success || test "${ISOLATED_RESULT}" = failure
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.confirm_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - run: bash tools/ci/install_runtime.sh
      - uses: actions/download-artifact@v4
        with:
          name: api-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-plan
      - name: Independently verify disposable PostgreSQL BEFORE any DDL
        run: >-
          python -c "import sys; sys.path.insert(0, 'apps/api/tests');
          from disposable_postgres import verified_ci_postgres; verified_ci_postgres()"
      - run: alembic -c packages/persistence/alembic.ini upgrade head
      - run: alembic -c packages/persistence/alembic.ini check
      - run: alembic -c packages/persistence/alembic.ini current
      - name: Run all PostgreSQL and unresolved-isolation cases serially
        id: serial
        run: >-
          python tools/ci/api_timings.py --output "${{ runner.temp }}/api-reports/serial"
          --plan "${{ runner.temp }}/api-plan/plan.json" --partition serial
          --plan-sha256 "${{ needs.prepare.outputs.plan_sha256 }}"
          --timeout-seconds 4800
          -- -c apps/api/pyproject.toml apps/api/tests
      - uses: actions/download-artifact@v4
        if: always() && steps.serial.outcome != 'skipped'
        with:
          pattern: api-report-${{ github.run_attempt }}-isolated-*
          path: ${{ runner.temp }}/api-reports
      - name: Aggregate required complete coverage (never pass on skipped/cancelled jobs)
        if: always()
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          ISOLATED_RESULT: ${{ needs.api_isolated.result }}
          SERIAL_RESULT: ${{ steps.serial.outcome }}
        run: >-
          python tools/ci/api_partitions.py gate
          --plan-sha256 "${{ needs.prepare.outputs.plan_sha256 }}"
          --plan "${{ runner.temp }}/api-plan/plan.json"
          --reports "${{ runner.temp }}/api-reports"
          --output "${{ runner.temp }}/api-reports/gate.json"
          --upstream "${PREPARE_RESULT}" --upstream "${ISOLATED_RESULT}" --upstream "${SERIAL_RESULT}"
      - name: Upload serial timings and aggregate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-aggregate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-reports/
          retention-days: 3
          if-no-files-found: error
      - name: Bind successful complete regression to the exact source
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          AUTHORIZATION_REFERENCE: ${{ inputs.authorization_reference }}
          REASON: ${{ inputs.reason }}
        run: >-
          python tools/ci/qualification.py emit
          --plan "${{ runner.temp }}/api-plan/plan.json"
          --gate "${{ runner.temp }}/api-reports/gate.json"
          --unit-proof "${{ runner.temp }}/api-plan/unit-coverage.json"
          --output "${{ runner.temp }}/qualification/qualification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: full-qualification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification/qualification.json
          retention-days: 30
          if-no-files-found: error
