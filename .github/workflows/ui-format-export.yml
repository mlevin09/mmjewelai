name: Temporary UI Prettier Export
on:
  pull_request:
    branches: [jewelai-v2]
    paths:
      - .github/workflows/ui-format-export.yml
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Format changed UI files and emit identifiable output
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write src/enrichment.ts src/EnrichmentWorkspace.tsx src/EnrichmentWorkspace.test.tsx
          for p in src/enrichment.ts src/EnrichmentWorkspace.tsx src/EnrichmentWorkspace.test.tsx; do
            echo "FORMATTED_START:${p}"
            base64 -w 0 "${p}"
            echo
            echo "FORMATTED_END:${p}"
          done
