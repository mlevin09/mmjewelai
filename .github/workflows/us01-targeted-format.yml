name: US01 targeted format fix
on:
  pull_request:
    branches: [jewelai-v2]
    paths:
      - 'apps/web/**'
      - '.github/workflows/us01-targeted-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 186 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Format only two changed UI files
        working-directory: apps/web
        run: |
          npm ci
          npx prettier --write src/EnrichmentWorkspace.tsx src/FirstTurnPilot.test.tsx
      - name: Commit format-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/EnrichmentWorkspace.tsx apps/web/src/FirstTurnPilot.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "US-01: format final review UI fixes"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
