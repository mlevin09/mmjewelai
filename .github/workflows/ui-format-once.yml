name: One-time UI formatter
on:
  push:
    branches:
      - chatgpt/ui-guided-design-v3-20261105
    paths:
      - .github/workflows/ui-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ui-guided-design-v3-20261105
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format only three UI files
        working-directory: apps/web
        run: |
          npm ci
          npx prettier --write src/EnrichmentWorkspace.tsx src/EnrichmentWorkspace.test.tsx src/styles.css
      - name: Commit formatting only when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/EnrichmentWorkspace.tsx apps/web/src/EnrichmentWorkspace.test.tsx apps/web/src/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style(web): apply Prettier to guided UI files"
            git push origin HEAD:chatgpt/ui-guided-design-v3-20261105
          fi
