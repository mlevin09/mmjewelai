name: Studio retirement PG04 completion (manual only)
on:
  workflow_dispatch:
    inputs:
      confirm_sha:
        description: Exact reviewed retirement implementation
        required: true
        type: string
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jewelai_test
          POSTGRES_USER: jewelai
          POSTGRES_PASSWORD: jewelai
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jewelai -d jewelai_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://jewelai:jewelai@localhost:5432/jewelai_test
      TEST_POSTGRES_URL: postgresql+psycopg://jewelai:jewelai@localhost:5432/jewelai_test
    steps:
      - name: Require the one authorized exact source and isolated manual ref
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
          SOURCE_REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          test "${EVENT}" = workflow_dispatch
          test "${SOURCE_REF}" = refs/heads/codex/qualify-studio-session-retirement-pg
          test "${CONFIRM_SHA}" = 1f0856eeca657036cd136daa79f5fe52264b9cee
      - uses: actions/checkout@v4
        with:
          ref: 1f0856eeca657036cd136daa79f5fe52264b9cee
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and unchanged reviewed production tree
        run: |
          test "$(git -C source rev-parse HEAD)" = 1f0856eeca657036cd136daa79f5fe52264b9cee
          git -C source diff --exit-code
          git -C source diff --exit-code a395a19c88a57678460a30d4dc7ba08daa8e13ae HEAD -- . ':!apps/api/tests/test_session_retirement_postgres.py'
          printf '%s\n' 'reviewed_application=a395a19c88a57678460a30d4dc7ba08daa8e13ae' 'qualification_source=1f0856eeca657036cd136daa79f5fe52264b9cee' 'harness_sha=${{ github.sha }}' > "${RUNNER_TEMP}/qualification-source.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runtime dependency set (no tests)
        working-directory: source
        run: bash tools/ci/install_runtime.sh
      - name: Verify actual disposable PostgreSQL container/cluster/job/freshness BEFORE DDL
        working-directory: source
        run: |
          python - <<'PY'
          import sys,json,subprocess,os
          from pathlib import Path
          sys.path.insert(0,'apps/api/tests')
          from disposable_postgres import verified_ci_postgres
          from jewelai_persistence import create_database_engine
          from sqlalchemy import text
          url=verified_ci_postgres()
          engine=create_database_engine(url)
          with engine.connect() as db:
              proof={'verified':True,'server_version_num':int(db.scalar(text('SHOW server_version_num'))),'cluster_id':str(db.scalar(text('SELECT system_identifier FROM pg_control_system()'))),'job':os.environ['GITHUB_JOB'],'run_id':os.environ['GITHUB_RUN_ID'],'source_sha':'1f0856eeca657036cd136daa79f5fe52264b9cee','containers':subprocess.check_output(['docker','ps','--filter','ancestor=postgres:16','--format','{{.ID}}'],text=True).splitlines()}
          engine.dispose()
          Path(os.environ['RUNNER_TEMP'],'postgres-identity.json').write_text(json.dumps(proof,indent=2))
          print(json.dumps(proof))
          PY
      - name: Execute only the authorized PostgreSQL qualification once
        working-directory: source
        run: |
          set -euo pipefail
          timeout 300s python -m pytest -c apps/api/pyproject.toml \
            'apps/api/tests/test_session_retirement_postgres.py::test_pg04_generation_lock_order[delete-retry]' \
            'apps/api/tests/test_session_retirement_postgres.py::test_pg04_generation_lock_order[generation-new]' \
            'apps/api/tests/test_session_retirement_postgres.py::test_pg04_generation_lock_order[generation-retry]' \
            apps/api/tests/test_session_retirement_postgres.py::test_pg04_role_revoked_after_http_check \
            apps/api/tests/test_session_retirement_postgres.py::test_pg04_transaction_fault_rolls_back \
            apps/api/tests/test_session_retirement_postgres.py::test_pg04_retirement_organization_lock_serializes_role_revocation \
            -q --maxfail=1 --tb=short --durations=8 \
            --junitxml="${RUNNER_TEMP}/retirement-pg.xml" 2>&1 | tee "${RUNNER_TEMP}/retirement-pg.log"
          python - <<'PY'
          import os,xml.etree.ElementTree as ET
          from pathlib import Path
          root=ET.parse(Path(os.environ['RUNNER_TEMP'],'retirement-pg.xml')).getroot()
          cases=root.findall('.//testcase')
          assert len(cases)==6, f'Expected6cases; found{len(cases)}'
          assert not root.findall('.//failure') and not root.findall('.//error') and not root.findall('.//skipped'), 'Incomplete qualification cannot pass'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-retirement-pg-completion-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/qualification-source.txt
            ${{ runner.temp }}/postgres-identity.json
            ${{ runner.temp }}/retirement-pg.xml
            ${{ runner.temp }}/retirement-pg.log
          retention-days: 30
          if-no-files-found: error
