name: One-time Smart Defaults candidate checks
on:
  push:
    branches:
      - chatgpt/smart-defaults-projection-candidate-20261106
    paths:
      - .github/workflows/smart-defaults-candidate-check.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './packages/domain[test]'
      - run: python -m pytest packages/domain/tests/test_smart_defaults_candidate.py -q
      - run: ruff check packages/domain/src/jewelai_domain/smart_defaults_candidate.py packages/domain/tests/test_smart_defaults_candidate.py
      - run: ruff format --check packages/domain/src/jewelai_domain/smart_defaults_candidate.py packages/domain/tests/test_smart_defaults_candidate.py
