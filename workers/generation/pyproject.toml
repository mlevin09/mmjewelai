[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jewelai-generation-worker"
version = "1.0.0"
description = "One-shot generation orchestration boundary for JewelAI V2"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "jewelai-assets==1.0.0",
  "jewelai-assets-gcs==1.0.0",
  "jewelai-generation-queue==1.0.0",
  "jewelai-model-gateway==1.0.0",
  "jewelai-model-gateway-openai==1.0.0",
  "jewelai-persistence==1.0.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jewelai_generation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
