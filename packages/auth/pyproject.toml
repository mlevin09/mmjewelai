[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jewelai-auth"
version = "1.0.0"
description = "Provider-neutral authentication and organization authorization contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jewelai_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
