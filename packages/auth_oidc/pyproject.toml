[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jewelai-auth-oidc"
version = "1.0.0"
description = "OIDC asymmetric JWT verifier for JewelAI"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "jewelai-auth==1.0.0",
  "PyJWT[crypto]>=2.15,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jewelai_auth_oidc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
