[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jewelai-observability"
version = "1.0.0"
description = "Dependency-free, privacy-safe failure diagnostics for JewelAI V2 structured logs"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jewelai_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
