[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jewelai-model-gateway-openai"
version = "1.0.0"
description = "OpenAI image-generation adapter for JewelAI V2"
requires-python = ">=3.12"
dependencies = [
  "jewelai-model-gateway==1.0.0",
  "openai>=3.19,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jewelai_model_gateway_openai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
