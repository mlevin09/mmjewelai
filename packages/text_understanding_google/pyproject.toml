[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jewelai-text-understanding-google"
version = "1.0.0"
description = "Google Generative Language text-understanding adapter for JewelAI V2"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "jewelai-parser==1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/jewelai_text_understanding_google"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
