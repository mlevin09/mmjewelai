[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jewelai-research-campaign"
version = "1.0.0"
description = "Private, bounded MCP research controller; not a JewelAI application dependency"
requires-python = ">=3.12"
dependencies = ["jewelai-native-llm-bench==1.0.0"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "ruff>=0.12,<1"]
# ADR 0044: isolated official-SDK resource server, not an application dependency.
https = [
    "mcp==2.3.0",
    "google-auth[requests]==2.58.0",
    "PyJWT[crypto]==2.15.1",
    "cryptography==48.0.1",
    "certifi==2026.10.23",
    "uvicorn==0.38.0",
]

[project.scripts]
jewelai-research = "jewelai_research.cli:main"
jewelai-research-https = "jewelai_research.https_gateway:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jewelai_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../native_llm_stage1/src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
